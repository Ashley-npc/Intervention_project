<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-label="Formulaire de connexion">
        <div class="brand-block">
          <div class="brand-logo">M</div>
          <h1>Maison Claire</h1>
          <p>Bienvenue dans votre espace</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="exemple@email.com" required />
          </div>

          <div class="field">
            <label for="password">Mot de passe</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" placeholder="Votre mot de passe" required />
              <button type="button" class="toggle-password" aria-label="Afficher le mot de passe" id="togglePassword">Afficher</button>
            </div>
          </div>

          <div class="options-row">
            <label class="remember-me">
              <input type="checkbox" name="remember" />
              <span>Se souvenir de moi</span>
            </label>
            <a href="#">Mot de passe oublié ?</a>
          </div>

          <button type="submit" class="btn-primary">Se connecter</button>

          <p id="message" class="message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="login.js"></script>
  </body>
</html>
